version: "2"

formatters:
  enable:
    - gofmt

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
  exclusions:
    generated: lax
    paths:
      - vendor
    rules:
      - linters:
          - staticcheck
        text: "^QF"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
