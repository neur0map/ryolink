name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  gate:
    name: Lint + build + test + security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Changelog in sync with the embedded copy
        run: make changelog-check

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

      - name: go vet
        run: go vet ./...

      - name: Build (static, CGO off)
        run: CGO_ENABLED=0 go build -trimpath -o bin/ryolink ./cmd/ryolink

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: Secret scan (tracked files)
        run: |
          hits=$(git grep -nIE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|-----BEGIN (OPENSSH |RSA )?PRIVATE KEY-----|AKIA[0-9A-Z]{16})' -- ':!*_test.go' ':!testdata' || true)
          if [ -n "$hits" ]; then
            echo "Possible secrets in tracked files:"
            echo "$hits"
            exit 1
          fi

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          # excluded after review, each a false positive in this design:
          #   G104 unchecked errors · G304 config-supplied file paths (operator-owned)
          #   G402 TLS verify (no outbound TLS with verification toggles)
          #   G115/G404 uint casts + math/rand for cosmetic jitter, not secrets
          #   G204/G702/G703 admin CLI execs git/systemctl with the caller's own
          #     argv, and signal files written to fixed names under data_dir
          gosec -quiet \
            -exclude=G104,G304,G402,G115,G404,G204,G702,G703 \
            ./...
